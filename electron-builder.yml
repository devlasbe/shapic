appId: com.shapic.app
productName: Shapic
copyright: Copyright © 2026 lasbe
directories:
  buildResources: resources
  output: dist
files:
  - "out/**/*"
  - "node_modules/sharp/**/*"
  - "node_modules/@img/**/*"
asarUnpack:
  - "node_modules/sharp/**/*.node"
  - "node_modules/@img/**/*.node"
mac:
  target:
    - dmg
  category: public.app-category.graphics-design
  artifactName: "${productName}-${arch}.${ext}"
win:
  target:
    - zip
  artifactName: "${productName}-Windows.${ext}"
