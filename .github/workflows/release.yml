name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            arch_name: apple_silicon
          - os: macos-15
            platform: mac
            arch: x64
            arch_name: intel
          - os: windows-latest
            platform: win
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        run: >-
          pnpm exec electron-builder
          --config electron-builder.yml
          --mac
          --${{ matrix.arch }}
          --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: >-
          pnpm exec electron-builder
          --config electron-builder.yml
          --win
          --${{ matrix.arch }}
          --publish never

      - name: Rename artifact (macOS)
        if: matrix.platform == 'mac'
        run: |
          for f in dist/*.dmg; do
            mv "$f" "${f//${{ matrix.arch }}/${{ matrix.arch_name }}}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch_name || matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
